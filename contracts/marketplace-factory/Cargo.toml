[package]
name = "marketplace-factory"
description = "Factory contract for isolated Gonka forward deals"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name = "factory-schema"
path = "examples/schema.rs"

[features]
default = []
library = []

[dependencies]
cosmwasm-schema.workspace = true
cosmwasm-std.workspace = true
cw-storage-plus.workspace = true
cw2.workspace = true
cw20.workspace = true
cw-utils.workspace = true
gonka-proto.workspace = true
marketplace-api.workspace = true
marketplace-common.workspace = true
thiserror.workspace = true

[dev-dependencies]
cw-multi-test.workspace = true
cw20-base.workspace = true
marketplace-deal = { workspace = true, features = ["library"] }
prost.workspace = true
serde.workspace = true
